<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Open Me ❤️</title>

<!-- Pinterest Luxe Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:#fff0f3;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
  overflow:hidden;
  font-family:'Playfair Display', serif;
}

/* Envelope */
.envelope {
  position:relative;
  width:260px;
  height:180px;
  background:#c1121f;
  border-radius:6px;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

.flap {
  position:absolute;
  top:0;
  width:100%;
  height:100%;
  background:#a4161a;
  clip-path: polygon(0 0, 100% 0, 50% 50%);
  transform-origin:top;
  transition:transform 1s ease;
}

.open .flap {
  transform:rotateX(180deg);
}

.open-btn {
  color:white;
  font-size:18px;
  letter-spacing:1px;
}

/* Card */
.card {
  position:absolute;
  width:220px;
  height:140px;
  background:white;
  border-radius:8px;
  top:100px;
  opacity:0;
  padding:15px;
  text-align:center;
  transition:all 1.2s ease;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.card h1 {
  font-family:'Great Vibes', cursive;
  font-size:30px;
  color:#c1121f;
  line-height:1.3;
}

.open .card {
  top:-120px;
  opacity:1;
}

/* Buttons */
.buttons {
  margin-top:30px;
  display:none;
}

button {
  padding:12px 28px;
  margin:10px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  background:#c1121f;
  color:white;
  transition:0.3s;
  font-family:'Playfair Display';
}

button:hover {
  transform:scale(1.1);
}

/* Celebration */
.celebration {
  display:none;
  text-align:center;
  position:absolute;
}

.celebration h2 {
  font-family:'Great Vibes';
  font-size:40px;
  color:#c1121f;
}

.friends {
  width:220px;
  margin-top:20px;
}

/* Falling Hearts */
.heart {
  position:absolute;
  color:#ff4d6d;
  font-size:20px;
  animation:fall 4s linear infinite;
}

@keyframes fall {
  0% {transform:translateY(-10vh) rotate(0deg);}
  100% {transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="envelope" onclick="openEnvelope()">
  <div class="flap"></div>
  <div class="open-btn">Open Me ❤️</div>
  <div class="card">
    <h1>Aryan Singh,<br>will you marry me in 365 days?</h1>
  </div>
</div>

<div class="buttons">
  <button onclick="celebrate()">Yes</button>
  <button onclick="celebrate()">A Million Times Yes</button>
</div>

<div class="celebration">
  <h2>Yayyyyyy! Countdown beginssss wohooooooo 💍</h2>
  <img src="friends.gif" class="friends">
</div>

<audio id="music" src="music.mp3"></audio>

<script>
function openEnvelope() {
  document.querySelector('.envelope').classList.add('open');
  document.getElementById("music").play();

  setTimeout(()=>{
    document.querySelector('.buttons').style.display="block";
    createHeartsFromEnvelope();
  },1500);
}

function celebrate() {
  document.querySelector('.envelope').style.display="none";
  document.querySelector('.buttons').style.display="none";
  document.querySelector('.celebration').style.display="block";
  fallingHearts();
}

function createHeartsFromEnvelope(){
  for(let i=0;i<15;i++){
    let heart=document.createElement("div");
    heart.innerHTML="❤️";
    heart.classList.add("heart");
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*2)+"s";
    document.body.appendChild(heart);
  }
}

function fallingHearts(){
  setInterval(()=>{
    let heart=document.createElement("div");
    heart.innerHTML="❤️";
    heart.classList.add("heart");
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(heart);
  },300);
}
</script>

</body>
</html>
