<!DOCTYPE html>
<html>
<head>
<title>For Aryan 💌</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* ENVELOPE */
.envelope-wrapper {
  position: relative;
  width: 200px;
  height: 140px;
  cursor: pointer;
}

.envelope {
  width: 100%;
  height: 100%;
  background: #ff4b91;
  position: absolute;
  bottom: 0;
  border-radius: 0 0 10px 10px;
}

.flap {
  width: 0;
  height: 0;
  border-left: 100px solid transparent;
  border-right: 100px solid transparent;
  border-bottom: 70px solid #ff6fa5;
  position: absolute;
  top: 0;
  transition: transform 0.6s ease;
  transform-origin: top;
}

.card {
  position: absolute;
  width: 180px;
  height: 120px;
  background: white;
  top: 10px;
  left: 10px;
  border-radius: 10px;
  text-align: center;
  padding: 15px;
  box-sizing: border-box;
  transform: translateY(40px);
  transition: transform 0.6s ease;
  color: #ff4b91;
}

.open .flap {
  transform: rotateX(180deg);
}

.open .card {
  transform: translateY(-120px);
}

/* QUESTION CARD */
.question-card {
  display: none;
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  color: #ff4b91;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

button {
  padding: 12px 25px;
  font-size: 16px;
  border-radius: 25px;
  border: none;
  margin: 15px;
  cursor: pointer;
}

#yesBtn {
  background-color: #ff4b91;
  color: white;
}

#noBtn {
  background-color: lightgray;
  position: absolute;
}

.message {
  margin-top: 10px;
  font-size: 14px;
}

.celebration {
  text-align: center;
  color: white;
}

.celebration img {
  width: 300px;
  border-radius: 20px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="envelope-wrapper" onclick="openEnvelope()" id="envelopeWrap">
  <div class="flap"></div>
  <div class="envelope"></div>
  <div class="card">Open Me 💌</div>
</div>

<div class="question-card" id="questionCard">
  <h2>Aryan, will you marry me in 365 days? 💍</h2>
  <button id="yesBtn" onclick="yesClicked()">Yes 💖</button>
  <button id="noBtn" onclick="noClicked()">No 🙈</button>
  <div class="message" id="noMessage"></div>
</div>

<script>

let noClickCount = 0;

function openEnvelope() {
  document.getElementById("envelopeWrap").classList.add("open");

  setTimeout(() => {
    document.getElementById("envelopeWrap").style.display = "none";
    document.getElementById("questionCard").style.display = "block";
  }, 700);
}

function noClicked() {
  noClickCount++;
  const msg = document.getElementById("noMessage");
  const noBtn = document.getElementById("noBtn");

  if (noClickCount === 1) {
    msg.innerHTML = "Not an option 😌";
  } else if (noClickCount === 2) {
    msg.innerHTML = "Think again 👀";
  } else {
    msg.innerHTML = "You know the right answer 💕";
  }

  // make No run away after teasing
  noBtn.style.left = Math.random() * 200 + "px";
  noBtn.style.top = Math.random() * 100 + "px";
}

function yesClicked() {
  document.body.innerHTML = `
    <div class="celebration">
      <h1>Yayyyyyy! Countdown beginssss wohooooooo 💍</h1>
      <img src="friends.gif">
    </div>
  `;
  startHearts();
  startBalloons();
}

function startHearts() {
  for (let i = 0; i < 250; i++) {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.style.position = "absolute";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = "-20px";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    document.body.appendChild(heart);

    let fall = setInterval(() => {
      heart.style.top = parseInt(heart.style.top) + 4 + "px";
      if (parseInt(heart.style.top) > window.innerHeight) {
        heart.remove();
        clearInterval(fall);
      }
    }, 20);
  }
}

function startBalloons() {
  setInterval(() => {
    let balloon = document.createElement("div");
    balloon.innerHTML = "🎈";
    balloon.style.position = "absolute";
    balloon.style.bottom = "0px";
    balloon.style.left = Math.random() * window.innerWidth + "px";
    balloon.style.fontSize = "30px";
    document.body.appendChild(balloon);

    let rise = setInterval(() => {
      balloon.style.bottom = parseInt(balloon.style.bottom) + 3 + "px";
      if (parseInt(balloon.style.bottom) > window.innerHeight) {
        balloon.remove();
        clearInterval(rise);
      }
    }, 20);
  }, 500);
}

</script>

</body>
</html>
