<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Message for Aryan</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

<style>
:root {
    --luxe-red: #b01b1b;
    --dark-red: #8b1414;
    --blush-ivory: #fdf5f5;
}

* { margin:0; padding:0; box-sizing:border-box; }

body, html {
    height:100%;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background-color:var(--blush-ivory);
    font-family:'Montserrat', sans-serif;
    overflow:hidden;
}

/* Envelope */
.envelope-wrapper {
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:10;
}

.envelope {
    position:relative;
    width:320px;
    height:220px;
    background-color:var(--luxe-red);
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    display:flex;
    justify-content:center;
    align-items:center;
}

.envelope .flap {
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:160px solid transparent;
    border-right:160px solid transparent;
    border-top:110px solid var(--dark-red);
    transform-origin:top;
    transition:transform 0.8s ease-in-out;
    z-index:4;
}

.envelope .pocket {
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:160px solid transparent;
    border-right:160px solid transparent;
    border-bottom:110px solid var(--luxe-red);
    z-index:3;
}

.card {
    position:absolute;
    bottom:10px;
    width:290px;
    height:190px;
    background:white;
    padding:25px 15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    z-index:2;
    transition:transform 1s ease-in-out 0.6s, bottom 1s ease-in-out 0.6s;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
}

.message {
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:1.3rem;
    color:#333;
    line-height:1.4;
}

.card-buttons {
    display:flex;
    gap:10px;
    opacity:0;
    transition:opacity 0.5s ease 1.5s;
}

.btn {
    background-color:var(--luxe-red);
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:25px;
    font-size:0.85rem;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

.btn:hover {
    background-color:var(--dark-red);
    transform:scale(1.05);
}

.open-btn {
    margin-top:40px;
    padding:12px 30px;
    background:transparent;
    border:1.5px solid var(--luxe-red);
    color:var(--luxe-red);
    font-family:'Great Vibes', cursive;
    font-size:1.8rem;
    border-radius:4px;
    cursor:pointer;
    transition:0.3s;
}

.open-btn:hover {
    background:var(--luxe-red);
    color:white;
}

/* Opened State */
.envelope.open .flap {
    transform:rotateX(180deg);
    z-index:1;
}

.envelope.open .card {
    bottom:130px;
    transform:scale(1.05);
    z-index:5;
}

.envelope.open .card-buttons {
    opacity:1;
}

/* Celebration */
#celebration {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-color:var(--blush-ivory);
    z-index:100;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.celebration-text {
    font-family:'Great Vibes', cursive;
    font-size:4rem;
    color:var(--luxe-red);
    margin-bottom:20px;
}

.celebration-gif {
    width:300px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.floating-heart {
    position:absolute;
    color:var(--luxe-red);
    pointer-events:none;
    font-size:20px;
}
</style>
</head>

<body>

<div class="envelope-wrapper" id="wrapper">
    <div class="envelope" id="envelope">
        <div class="flap"></div>
        <div class="pocket"></div>
        <div class="card">
            <p class="message">
                Aryan Singh, will you marry me in 365 days? <br> ♥
            </p>
            <div class="card-buttons">
                <button class="btn" onclick="startFinalCelebration()">Yes</button>
                <button class="btn" onclick="startFinalCelebration()">A Million Times Yes</button>
            </div>
        </div>
    </div>
    <button class="open-btn" id="openTrigger" onclick="openEnvelope()">Open Me ❤️</button>
</div>

<div id="celebration">
    <h1 class="celebration-text">Yayyyyyy! Countdown begins 💍</h1>
    <img class="celebration-gif" src="friends.gif" alt="Excited Friends GIF">
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
function openEnvelope() {
    const envelope = document.getElementById('envelope');
    const openBtn = document.getElementById('openTrigger');

    envelope.classList.add('open');
    openBtn.style.opacity='0';
    setTimeout(()=>openBtn.style.display='none',300);

    releaseHearts();
}

function releaseHearts() {
    for(let i=0;i<15;i++){
        setTimeout(()=>{
            const heart=document.createElement('div');
            heart.innerHTML='❤️';
            heart.className='floating-heart';
            heart.style.left='50%';
            heart.style.top='40%';
            heart.style.transition='all 2.5s ease-out';
            document.body.appendChild(heart);

            const xMove=(Math.random()-0.5)*400;
            const yMove=-300-Math.random()*200;

            requestAnimationFrame(()=>{
                heart.style.transform=`translate(${xMove}px, ${yMove}px) rotate(${Math.random()*360}deg)`;
                heart.style.opacity='0';
            });

            setTimeout(()=>heart.remove(),2500);
        },i*150);
    }
}

function startFinalCelebration() {
    document.getElementById('wrapper').style.display='none';
    const celeb=document.getElementById('celebration');
    celeb.style.display='flex';

    const duration=10000;
    const end=Date.now()+duration;

    const interval=setInterval(()=>{
        if(Date.now()>end) return clearInterval(interval);

        confetti({
            particleCount:40,
            spread:70,
            origin:{y:0.1,x:Math.random()},
            colors:['#b01b1b','#ff6666','#ffb3b3'],
            shapes:['heart'],
            scalar:2
        });
    },300);
}
</script>

</body>
</html>
