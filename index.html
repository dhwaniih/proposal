<!DOCTYPE html>
<html>
<head>
<title>For Aryan 💌</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* ENVELOPE */
.wrapper {
  position: relative;
  width: 250px;
  height: 180px;
  cursor: pointer;
}

.envelope {
  width: 100%;
  height: 120px;
  background: #ff4b91;
  position: absolute;
  bottom: 0;
  border-radius: 0 0 10px 10px;
}

.flap {
  position: absolute;
  top: 0;
  width: 0;
  height: 0;
  border-left: 125px solid transparent;
  border-right: 125px solid transparent;
  border-bottom: 90px solid #ff6fa5;
  transform-origin: top;
  transition: transform 0.8s ease;
}

.card-inside {
  position: absolute;
  width: 220px;
  height: 140px;
  background: white;
  top: 20px;
  left: 15px;
  border-radius: 10px;
  text-align: center;
  line-height: 140px;
  color: #ff4b91;
  font-weight: bold;
  transform: translateY(60px);
  transition: transform 0.8s ease;
}

.open .flap {
  transform: rotateX(180deg);
}

.open .card-inside {
  transform: translateY(-140px);
}

/* QUESTION CARD */
.question {
  display: none;
  position: absolute;
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  color: #ff4b91;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
}

button {
  padding: 12px 25px;
  font-size: 16px;
  border-radius: 25px;
  border: none;
  margin: 15px;
  cursor: pointer;
  background: #ff4b91;
  color: white;
  transition: transform 0.2s;
}

button:hover {
  transform: scale(1.1);
}

.celebration {
  text-align: center;
  color: white;
}

.celebration img {
  width: 300px;
  border-radius: 20px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="wrapper" id="envelope" onclick="openEnvelope()">
  <div class="flap"></div>
  <div class="envelope"></div>
  <div class="card-inside">Open Me 💌</div>
</div>

<div class="question" id="questionBox">
  <h2>Aryan, will you marry me in 365 days? 💍</h2>
  <button onclick="celebrate()">Yes 💖</button>
  <button onclick="celebrate()">A million times yes 💞</button>
</div>

<script>

function openEnvelope() {
  document.getElementById("envelope").classList.add("open");

  setTimeout(() => {
    document.getElementById("envelope").style.display = "none";
    document.getElementById("questionBox").style.display = "block";
  }, 900);
}

function celebrate() {
  document.body.innerHTML = `
    <div class="celebration">
      <h1>Yayyyyyy! Countdown beginssss wohooooooo 💍</h1>
      <img src="friends.gif">
    </div>
  `;
  startHeartRain();
  startBalloons();
}

/* SCATTERED HEART RAIN */
function startHeartRain() {
  setInterval(() => {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.style.position = "absolute";
    heart.style.top = "-20px";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    document.body.appendChild(heart);

    let fall = setInterval(() => {
      heart.style.top = parseInt(heart.style.top) + (Math.random() * 5 + 2) + "px";
      heart.style.left = parseInt(heart.style.left) + (Math.random() * 4 - 2) + "px";

      if (parseInt(heart.style.top) > window.innerHeight) {
        heart.remove();
        clearInterval(fall);
      }
    }, 20);
  }, 150);
}

/* FLOATING HEART BALLOONS */
function startBalloons() {
  setInterval(() => {
    let balloon = document.createElement("div");
    balloon.innerHTML = "💗";
    balloon.style.position = "absolute";
    balloon.style.bottom = "0px";
    balloon.style.left = Math.random() * window.innerWidth + "px";
    balloon.style.fontSize = "30px";
    document.body.appendChild(balloon);

    let rise = setInterval(() => {
      balloon.style.bottom = parseInt(balloon.style.bottom) + 3 + "px";
      if (parseInt(balloon.style.bottom) > window.innerHeight) {
        balloon.remove();
        clearInterval(rise);
      }
    }, 20);
  }, 500);
}

</script>

</body>
</html>
